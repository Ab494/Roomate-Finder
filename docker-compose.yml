services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roommate_finder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"          # fix: host:container (postgres always on 5432 inside)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s          # check every 10 seconds
      timeout: 5s            # fail if no response in 5 seconds
      retries: 5             # try 5 times before marking unhealthy
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Django web (Gunicorn HTTP) ──────────────────────────────────────────────
  web:
    build: .
    # no 'command' here — uses CMD from Dockerfile (migrate + collectstatic + gunicorn)
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles   # named volume shared with nginx
    ports:
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy     # wait until postgres is actually ready
      redis:
        condition: service_healthy     # wait until redis is actually ready
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ── Daphne (ASGI / WebSockets) ─────────────────────────────────────────────
  channels:
    build: .
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    volumes:
      - .:/app
    ports:
      - "8003:8001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery worker ───────────────────────────────────────────────────────────
  worker:
    build: .
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery beat ─────────────────────────────────────────────────────────────
  beat:
    build: .
    command: >
      celery -A config beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers.DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - staticfiles:/app/staticfiles   # same named volume as web
    depends_on:
      - web
      - channels
    restart: unless-stopped

volumes:
  pgdata:
  staticfiles:    # named volume — shared between web and nginx
