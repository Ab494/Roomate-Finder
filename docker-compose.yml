services:
  # Main Django web application server
  web:
    build: .  # Build from local Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120  # Run with Gunicorn WSGI server
    volumes:
      - .:/app  # Mount source code for development
    ports:
      - "8000:8000"  # Expose port 8000 for HTTP requests
    env_file:
      - .env  # Load environment variables
    depends_on:
      - db   # Wait for database
      - redis  # Wait for Redis
    restart: unless-stopped  # Auto-restart unless manually stopped

  # WebSocket server for real-time messaging
  channels:
    build: .  # Same build as web service
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application  # Run ASGI server for WebSockets
    volumes:
      - .:/app  # Mount source code
    ports:
      - "8001:8001"  # Expose port 8001 for WebSocket connections
    env_file:
      - .env  # Load environment variables
    depends_on:
      - db   # Wait for database
      - redis  # Wait for Redis
    restart: unless-stopped

  # Celery worker for background tasks
  worker:
    build: .  # Same build
    command: celery -A config worker --loglevel=info --concurrency=4  # Run Celery worker with 4 processes
    volumes:
      - .:/app  # Mount source code
    env_file:
      - .env  # Load environment variables
    depends_on:
      - db   # Wait for database
      - redis  # Wait for Redis (message broker)
    restart: unless-stopped

  # Celery beat scheduler for periodic tasks
  beat:
    build: .  # Same build
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers.DatabaseScheduler  # Run beat scheduler
    volumes:
      - .:/app  # Mount source code
    env_file:
      - .env  # Load environment variables
    depends_on:
      - db   # Wait for database
      - redis  # Wait for Redis
    restart: unless-stopped

  # PostgreSQL database
  db:
    image: postgres:16-alpine  # Use PostgreSQL 16 Alpine image
    environment:
      POSTGRES_DB: roommate_finder      # Database name
      POSTGRES_USER: postgres           # Database user
      POSTGRES_PASSWORD: password       # Database password
    volumes:
      - pgdata:/var/lib/postgresql/data  # Persistent data volume
    ports:
      - "5433:5433"  # Expose port 5433 for database connections
    restart: unless-stopped

  # Redis for caching and message broker
  redis:
    image: redis:7-alpine  # Use Redis 7 Alpine image
    ports:
      - "6379:6379"  # Expose port 6379 for Redis connections
    restart: unless-stopped

  # Nginx reverse proxy and static file server
  nginx:
    image: nginx:alpine  # Use Nginx Alpine image
    ports:
      - "80:80"  # Expose port 80 for HTTP traffic
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # Nginx configuration
      - ./staticfiles:/app/staticfiles              # Static files volume
    depends_on:
      - web     # Wait for web service
      - channels  # Wait for channels service
    restart: unless-stopped

volumes:
  pgdata:
